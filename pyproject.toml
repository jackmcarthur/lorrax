[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lorrax"
version = "0.1.0"
description = "LORRAX: Low-scaling Real-space Real-Axis eXcited state package"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.14.0",
    "jax[cuda13]>=0.9.0",
    "jaxlib>=0.9.0",
    "matplotlib>=3.10.3",
    "numpy>=2.3.1",
    "scipy>=1.16.0",
    "xmlschema>=4.1.0",
    "xsdata[cli]>=25.7",
]

[project.optional-dependencies]
# Documentation site (mkdocs-material + mkdocstrings). Build-only; not pulled
# in by a plain `pip install lorrax`. Build with `mkdocs build`.
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.20",
    "mkdocstrings>=0.30.1",
    "mkdocstrings-python>=1.18.2",
]
# NOTE: the default GPU stack is CUDA 13 / JAX >=0.9 (see
# [project.dependencies] `jax[cuda13]`). A CUDA-12 install path on the same
# JAX 0.9 line (`jax[cuda12]>=0.9.0`) is a plausible future support-matrix
# row but is not offered here yet, so no `cuda12` extra is defined.

[project.scripts]
lorrax-gw = "gw.gw_jax:main"
gw_jax = "gw.gw_jax:main"
lorrax-centroids = "centroid.kmeans_cli:main"
# NOTE: `lorrax-bse` was removed. Its former target `bse.bse_isdf:main` was
# deleted (commit a0da0a5; it was a deprecation shim with no main()). The
# current BSE driver `bse.bse_jax` keeps its CLI inside an
# `if __name__ == "__main__":` block and exposes no importable `main()`, so it
# cannot be wired as a console script without a source refactor. Re-add this
# entry once `bse.bse_jax` (or a successor) gains a module-level `main()`.

[tool.uv]
package = true

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
common = [
    "minimax_assets/*.json",
    "minimax_assets/*.md",
    "minimax_assets/crossing/*.npz",
    "minimax_assets/noncrossing/*.npz",
]
ffi = [
    "AGENTS.md",
    "PORTING.md",
    "TEMPLATE.md",
    "common/cpp/CMakeLists.txt",
    "common/cpp/*.cc",
    "common/cpp/*.h",
    "common/cpp/*.sh",
    "cublasmp/cpp/*.cc",
    "cublasmp/cpp/*.cu",
    "cublasmp/cpp/*.h",
    "cusolvermg/cpp/*.cc",
    "cusolvermp/cpp/*.cc",
    "cusolvermp/cpp/*.h",
    "cusolvermp/scripts/*.sh",
    "phdf5/ARCHITECTURE.md",
    "phdf5/cpp/*.cc",
    "phdf5/cpp/*.h",
    "phdf5/scripts/*.sh",
    "slate/README.md",
    "slate/cpp/*.cc",
    "slate/cpp/*.h",
    "slate/scripts/*.sh",
]

[tool.uv.workspace]
members = [
    
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archive"]
# `extra` (tooling / experimental / out-of-repo-fixture suites) is
# deselected by default; run them with `-m extra` (an explicit -m on the
# command line overrides this addopts default).
addopts = "-m 'not extra'"
markers = [
    "regression: end-to-end physics regression tests with reference files",
    "gpu: tests that require a CUDA-capable JAX backend",
    "extra: staged/tooling suites deselected by default (run with -m extra)",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "pytest>=8.0.0",
]
jax = [
    "jax[cuda13]>=0.9.0",
    "jaxlib>=0.9.0",
]
build = [
    "scikit-build-core>=0.11.0",
    "cmake>=4.0.0",
    "ninja>=1.10.0",
]
profile = [
    "tensorboard>=2.20.0",
    "tensorboard-plugin-profile>=2.22.0",
    "xprof>=2.22.0",
]
