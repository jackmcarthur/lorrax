[project]
name = "lorrax"
version = "0.1.0"
description = "LORRAX: Low-scaling Real-space Real-Axis eXcited state package"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.14.0",
    # NO CUDA VARIANT PINNED HERE — it is a SITE fact, not a package fact.
    # Pick one at install time:  pip install -e '.[cuda13]'  (Perlmutter)
    #                            pip install -e '.[cuda12]'  (Frontera rtx)
    # See [project.optional-dependencies] below for the support matrix.
    #
    # THE WINDOW, NOT JUST A FLOOR, and it is enforced at startup by
    # src/runtime/jax_support.py (SUPPORTED_MIN / SUPPORTED_MAX_EXCLUSIVE).
    # Those two must agree with these specifiers; a floor nothing checks is
    # how the Perlmutter GPU leg came to run four minors below it unnoticed.
    #
    # 0.7.0 floor (lowered from 0.9.0 on 2026-08-06): varying-manual-axes
    # tracking inside shard_map starts there, `jax.shard_map` and `lax.pvary`
    # exist from there, and — decisively — no NVIDIA JAX container has BOTH
    # jax >= 0.9 and CUDA 12, while the Perlmutter device FFI .so links
    # CUDA 12.  A 0.9 floor was unsatisfiable on that leg by construction.
    # 0.10 ceiling: nothing above has been run on either leg.
    "jax>=0.7.0,<0.10.0",
    "jaxlib>=0.7.0,<0.10.0",
    "matplotlib>=3.10.3",
    "numpy>=2.3.1",
    "scipy>=1.16.0",
    "xmlschema>=4.1.0",
    "xsdata[cli]>=25.7",
]

[project.optional-dependencies]
# Documentation site (mkdocs-material + mkdocstrings). Build-only; not pulled
# in by a plain `pip install lorrax`. Build with `mkdocs build`.
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.20",
    "mkdocstrings>=0.30.1",
    "mkdocstrings-python>=1.18.2",
]
# ---------------------------------------------------------------------------
# GPU SUPPORT MATRIX — one extra per CUDA major, chosen per SITE.
#
# This used to be a single hard pin in [project.dependencies], flipped
# cuda13 -> cuda12 on 2026-07-24 for TACC Frontera and thereby silently
# downgrading every other machine.  A global pin cannot express a fact that
# differs per machine; an extra can.  The driver is what constrains this:
#
#   site                 GPU              driver        CUDA userspace  extra
#   -------------------  ---------------  ------------  --------------  ------
#   NERSC Perlmutter     A100 (sm_80)     580.159.04    13.0            cuda13
#   TACC Frontera (rtx)  RTX 5000 (sm_75) 535.113.01    12.2            cuda12
#
# CUDA 13 needs a >=580 driver, which is why Frontera cannot use it.  Driver
# 535 runs the full CUDA 12.x userspace via minor-version compatibility and
# JAX on CUDA 12 supports sm_52+, so Turing is well within range there.
#
# CPU-ONLY installs need NEITHER extra: the base `jax`/`jaxlib` dependency is
# the CPU build, which is what the host-platform FFI leg runs against.
#
# The production Perlmutter Shifter leg uses NEITHER bundled extra: jax and
# its plugin come from the image (`config/perlmutter/site_config.sh`), whose
# device FFI is CUDA 12.  The experimental bare-host lane deliberately uses
# `cuda13-local` below so JAX consumes `cudatoolkit/13.2` instead of pulling a
# second toolkit into the venv; see config/perlmutter/cuda13_module/.
cuda12 = ["jax[cuda12]>=0.7.0,<0.10.0"]
cuda13 = ["jax[cuda13]>=0.7.0,<0.10.0"]
# System-toolkit variant: installs the CUDA-13 JAX plugin but not pip's copy
# of the CUDA runtime.  This is the Perlmutter bare-host module lane under
# config/perlmutter/cuda13_module; CUDA_HOME/LD_LIBRARY_PATH supply the NERSC
# toolkit, math libraries, NCCL, and the deliberately staged cuDNN DSO.
cuda13-local = ["jax[cuda13-local]>=0.7.0,<0.10.0"]

[project.scripts]
lorrax-gw = "gw.gw_jax:main"
gw_jax = "gw.gw_jax:main"
lorrax-centroids = "centroid.kmeans_cli:main"
lorrax-downfold = "gw.downfold_cli:main"
# NOTE: `lorrax-bse` was removed. Its former target `bse.bse_isdf:main` was
# deleted (commit a0da0a5; it was a deprecation shim with no main()). The
# current BSE driver `bse.bse_jax` keeps its CLI inside an
# `if __name__ == "__main__":` block and exposes no importable `main()`, so it
# cannot be wired as a console script without a source refactor. Re-add this
# entry once `bse.bse_jax` (or a successor) gains a module-level `main()`.

[tool.uv]
package = true

# NOTHING HERE.  ``common/minimax_assets/`` used to be declared as package
# data on this line; the bundle rides with the ``minimax`` service now
# (``services/minimax/pyproject.toml``), which is what let the door read it
# through ``importlib.resources.files("minimax")`` and cut the single
# production import edge into ``common``.  The table is kept, empty, because
# it is the place a NEW package-data claim would have to go.
[tool.setuptools.package-data]

[tool.uv.workspace]
members = [
    
]

[tool.pytest.ini_options]
# `services` carries the standalone service suites (charter: own fast
# pytests STAGED INTO the main suite).  ORDER MATTERS: tests/ first, so a
# lorrax module imports jax before any service conftest can force a host
# device count on the whole run — see services/distrib_la/tests/conftest.py.
testpaths = ["tests", "services"]
# `bench` holds standalone bench/smoke drivers (moved out of src/ 2026-07-31);
# they are argv-driven scripts with jax preambles, not pytest suites.
# `services/*/bench` is the same thing for a service: claims-style baseline
# drivers, never part of the default run.
norecursedirs = ["archive", "bench"]
# `extra` (tooling / experimental / out-of-repo-fixture suites) is
# deselected by default; run them with `-m extra` (an explicit -m on the
# command line overrides this addopts default).
#
# THE SERVICE TIERS ARE NOT DESELECTED HERE, and could not be: an explicit
# `-m` on the command line REPLACES this default rather than composing with
# it, so `-m "not services"` would silently re-enable the whole extra tier.
# Service deselection goes through the collection hook in tests/conftest.py
# (--no-services / --only-service / LX_SKIP_SERVICES), which composes.
#
# THE DEFAULT TIER IS NOT SPELLED HERE EITHER, for that same reason.  Since
# 2026-08-09 a bare `pytest` runs only the Si end-to-end smoke for the
# drivers the branch touched plus the services' suites; `pytest --census`
# (or `-m census`) is the full run this addopts line describes, and it is
# the run tests/KNOWN_FAILURES.md accounts for.  The narrowing lives in the
# collection hook in tests/conftest.py, next to the roster in
# tests/fast_gate.py.
addopts = "-m 'not extra'"
markers = [
    "census: the periodic FULL accounting — applied automatically by tests/conftest.py to every cell that is not `extra`, so `-m census` collects exactly what a bare `pytest` collected before the 2026-08-09 default-gate split",
    "regression: end-to-end physics regression tests with reference files",
    "gpu: tests that require a CUDA-capable JAX backend",
    "mesh(n): needs an n-device SINGLE-PROCESS mesh (default 4).  tests/conftest.py runs the cell on the session's real devices — in a child process when this one is pinned to a single GPU — and skips only when the node genuinely has fewer than n.  Replaces `skipif(jax.device_count() < 4)`, which skipped in EVERY suite run because the pin makes device_count() 1.  NOT a substitute for a multi-process P=n leg: an in-process multi-device mesh cannot execute the flat-k cuFFT FFI (it aborts uncatchably), so the child refuses LORRAX_FFT_FFI and a gate that needs it at P=n belongs in tests/multi_device/",
    "procs(n): needs n real PROCESSES, not n devices in one process (default 4).  A DIFFERENT contract from `mesh(n)` above and deliberately a separate marker: `mesh(n)` widens ONE process to n devices, where jax.process_count() is 1, the compile-cache agreement layer is never installed and ArrayImpl._multi_slice is never reached — so it cannot express the rank-divergence class at all.  A `procs(n)` cell launches n processes itself (tests/mesh_launch.py: srun, or n local processes with an explicit jax coordinator, one GPU each) and skips with a reason when no n-process launch is available.  Today: tests/test_jax_cache_contract.py",
    "extra: staged/tooling suites deselected by default (run with -m extra)",
    "services: a standalone service's own suite, staged into this one",
    "distrib_la: the distrib_la service suite (services/distrib_la/tests)",
    "wfn_loader: the wfn_loader service suite (services/wfn_loader/tests)",
    "zeta_loader: the zeta_loader service suite (services/zeta_loader/tests)",
    "symmetry_maps: the symmetry_maps service suite (services/symmetry_maps/tests)",
    "vcoul: the vcoul service suite (services/vcoul/tests)",
    "minimax: the minimax service suite (services/minimax/tests)",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "pytest>=8.0.0",
]
jax = [
    # CPU/base only — see [project.optional-dependencies] cuda12 / cuda13 for
    # the per-site GPU variant.  Do not re-pin a CUDA major here.
    # Same window as [project.dependencies] and src/runtime/jax_support.py.
    "jax>=0.7.0,<0.10.0",
    "jaxlib>=0.7.0,<0.10.0",
]
build = [
    "scikit-build-core>=0.11.0",
    "cmake>=4.0.0",
    "ninja>=1.10.0",
]
profile = [
    "tensorboard>=2.20.0",
    "tensorboard-plugin-profile>=2.22.0",
    "xprof>=2.22.0",
]
