[build-system]
requires = ["scikit-build-core>=0.11.0", "nanobind>=2.0.0", "cmake>=4.0.0", "ninja>=1.10.0"]
build-backend = "scikit_build_core.build"

[project]
name = "lorrax"
version = "0.1.0"
description = "LORRAX: Low-scaling Real-space Real-Axis eXcited state package"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.14.0",
    # JAX version and CUDA pairing come from the container/bind-mounts
    # (nvcr.io/nvidia/jax:25.04-py3 ships JAX 0.5.x + CUDA 12.x).
    # Do NOT add a cuda13/cuda12 extra here; it breaks installs inside
    # the container where jax is already present with the right CUDA.
    "jax>=0.5",
    "jaxlib>=0.5",
    "matplotlib>=3.10.3",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.20",
    "mkdocstrings>=0.30.1",
    "mkdocstrings-python>=1.18.2",
    "numpy>=2.3.1",
    "scipy>=1.16.0",
    "xmlschema>=4.1.0",
    "xsdata[cli]>=25.7",
]

[project.scripts]
lorrax-gw = "gw.gw_jax:main"
gw_jax = "gw.gw_jax:main"
lorrax-centroids = "centroid.kmeans_cli:main"
lorrax-bse = "bse.bse_isdf:main"

[tool.uv]
package = true

[tool.setuptools.package-data]
common = [
    "minimax_assets/*.json",
    "minimax_assets/*.md",
    "minimax_assets/crossing/*.npz",
    "minimax_assets/noncrossing/*.npz",
]

[tool.uv.workspace]
members = [

]

[tool.scikit-build]
# Delegate to the existing FFI CMakeLists.txt via a thin top-level wrapper.
cmake.source-dir = "."
cmake.build-type = "Release"

# GPU-backend toggle anticipating future ROCm support (only "cuda" is wired
# today).  Pass -DLORRAX_GPU_BACKEND=rocm on AMD clusters once the rocm
# path exists.
cmake.args = ["-DLORRAX_GPU_BACKEND=cuda"]

# Install the built .so into ffi/common/cpp/ inside the wheel, where
# ffi_loader.py's _candidate_paths() finds it via sys.path scan.
wheel.packages = ["src/ffi", "src/common", "src/gw", "src/bse", "src/centroid",
                  "src/bandstructure", "src/file_io", "src/mixing",
                  "src/postprocess", "src/psp", "src/runtime", "src/solvers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archive"]
markers = [
    "regression: end-to-end physics regression tests with reference files",
    "gpu: tests that require a CUDA-capable JAX backend",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "pdoc>=15.0.4",
    "pydoc-markdown>=4.8.2",
    "pytest>=8.0.0",
]
# JAX version comes from the container; this group is for local/non-container
# environments only.  Do NOT add a cuda extra -- let the caller decide.
jax = [
    "jax>=0.5",
    "jaxlib>=0.5",
]
profile = [
    "tensorboard>=2.20.0",
    "tensorboard-plugin-profile>=2.22.0",
    "xprof>=2.22.0",
]
