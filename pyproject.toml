[project]
name = "lorrax"
version = "0.1.0"
description = "LORRAX: Low-scaling Real-space Real-Axis eXcited state package"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cupy-cuda13x>=13.6.0",
    "h5py>=3.14.0",
    "jax[cuda13]>=0.9.0",
    "jaxlib>=0.9.0",
    "matplotlib>=3.10.3",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.20",
    "mkdocstrings>=0.30.1",
    "mkdocstrings-python>=1.18.2",
    "numpy>=2.3.1",
    "scipy>=1.16.0",
    "xmlschema>=4.1.0",
    "xsdata[cli]>=25.7",
]

[project.scripts]
lorrax-gw = "gw.gw_jax:main"
gw_jax = "gw.gw_jax:main"
lorrax-centroids = "centroid.kmeans_isdf:main"
lorrax-bse = "bse.bse_isdf:main"

[tool.uv]
package = true

[tool.setuptools.package-data]
common = [
    "minimax_assets/*.json",
    "minimax_assets/*.md",
    "minimax_assets/crossing/*.npz",
    "minimax_assets/noncrossing/*.npz",
]

[tool.uv.workspace]
members = [
    
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archive"]
markers = [
    "regression: end-to-end physics regression tests with reference files",
    "gpu: tests that require a CUDA-capable JAX backend",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "pdoc>=15.0.4",
    "pydoc-markdown>=4.8.2",
    "pytest>=8.0.0",
]
jax = [
    "jax[cuda13]>=0.9.0",
    "jaxlib>=0.9.0",
]
build = [
    "scikit-build-core>=0.11.0",
    "cmake>=4.0.0",
    "ninja>=1.10.0",
    "pybind11>=3.0.0",
    "nanobind>=2.0.0",
]
profile = [
    "tensorboard>=2.20.0",
    "tensorboard-plugin-profile>=2.22.0",
    "xprof>=2.22.0",
]
