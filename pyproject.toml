[project]
name = "lorrax"
version = "0.1.0"
description = "LORRAX: Low-scaling Real-space Real-Axis eXcited state package"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.14.0",
    "jax[cuda12]>=0.5.3,<0.6",
    "jaxlib>=0.5.3,<0.6",
    "matplotlib>=3.10.3",
    "numpy>=2.3.1",
    "scipy>=1.16.0",
    "xmlschema>=4.1.0",
    "xsdata[cli]>=25.7",
]

[project.optional-dependencies]
# Documentation site (mkdocs-material + mkdocstrings). Build-only; not pulled
# in by a plain `pip install lorrax`. Build with `mkdocs build`.
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.20",
    "mkdocstrings>=0.30.1",
    "mkdocstrings-python>=1.18.2",
]
# CUDA-12 GPU stack. Pinned to the JAX 0.5.x line that the production
# Shifter image (nvcr.io/nvidia/jax:25.04-py3) ships and the FFI links
# against (CUDA 12.9). The FFI XLA-FFI ABI is baked into the headers at
# build time, so the JAX pin is intentionally narrow.
#
# NOTE: a CUDA-13 / JAX >=0.9 configuration is a separate, untested support
# matrix row (use `jax[cuda13]>=0.9.0`); it is NOT the default because the
# native FFI .so is currently built and validated against CUDA 12.9.
cuda12 = ["jax[cuda12]>=0.5.3,<0.6"]

[project.scripts]
lorrax-gw = "gw.gw_jax:main"
gw_jax = "gw.gw_jax:main"
lorrax-centroids = "centroid.kmeans_cli:main"
lorrax-bse = "bse.bse_isdf:main"

[tool.uv]
package = true

[tool.setuptools.package-data]
common = [
    "minimax_assets/*.json",
    "minimax_assets/*.md",
    "minimax_assets/crossing/*.npz",
    "minimax_assets/noncrossing/*.npz",
]

[tool.uv.workspace]
members = [
    
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archive"]
markers = [
    "regression: end-to-end physics regression tests with reference files",
    "gpu: tests that require a CUDA-capable JAX backend",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "pytest>=8.0.0",
]
jax = [
    "jax[cuda12]>=0.5.3,<0.6",
    "jaxlib>=0.5.3,<0.6",
]
build = [
    "scikit-build-core>=0.11.0",
    "cmake>=4.0.0",
    "ninja>=1.10.0",
]
profile = [
    "tensorboard>=2.20.0",
    "tensorboard-plugin-profile>=2.22.0",
    "xprof>=2.22.0",
]
