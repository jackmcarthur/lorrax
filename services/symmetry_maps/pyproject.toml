[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "symmetry_maps"
version = "0.1.0"
description = "Crystal symmetry for a plane-wave deck: k-grid reduction and IBZ<->full-BZ tables, the band-index k-star map, the sharded q-axis unfolds, the psi-unfold antiunitary rule, real-space orbit permutations, and the time-reversal measurement"
requires-python = ">=3.12"

# THE QUARANTINE, DECLARED.  ``psp`` and ``file_io`` appear nowhere in this
# list because nothing here imports them at module scope: the density
# quadrature is INJECTED (`valence_density_fn` / `spin_degeneracy_fn` on
# `check_density_symmetries`, WAVE1_BRIEF ruling 4) and its `None` default
# does the same lazy `psp.get_DFT_mtxels` import the module always did, on
# the one call path that has a loader in hand.  An installed symmetry_maps
# on a machine with no lorrax imports fine and answers every table
# question; it needs `psp` only when a caller asks it to build rho.
#
# lxkit is the shared foundation (Gate/probe vocabulary/jax-version shims);
# this package reaches it through its test tier today and depends on it the
# same way distrib_la does.  jax is the substrate the unfolds are written
# in — `unfold_isdf_operator` is a `shard_map` over an ('x','y') mesh — and numpy is
# the substrate the tables are: `SymMaps` builds them eagerly on the host.
dependencies = ["lxkit", "jax", "numpy"]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "numpy"]
# `qirr_store` is the ONE module here that opens a file, and h5py is
# declared as an EXTRA rather than a runtime dependency so that the
# statement above stays true: an installed symmetry_maps still imports on
# a machine with no h5py and still answers every table question from
# arrays.  The module imports h5py lazily, inside the functions that open
# the file, and `test_symmetry_maps_import_isolation.py` measures that
# `import symmetry_maps` leaves h5py out of `sys.modules` even with the
# store on the door.
store = ["h5py"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `bench/` holds claims-style baseline drivers, not a pytest suite.
norecursedirs = ["bench"]
# The SAME two markers the monorepo registers.  Declared in both places on
# purpose: `pytest services/symmetry_maps/tests` from the monorepo root
# picks THIS file as its rootdir config (it is the nearest pyproject.toml
# above the argument), so a service that only registered them upstairs
# emits PytestUnknownMarkWarning on exactly the invocation the charter
# calls its standalone one.
markers = [
    "services: a standalone service's own suite, staged into the main one",
    "symmetry_maps: the symmetry_maps service suite",
]
