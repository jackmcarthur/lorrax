[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "distrib_la"
version = "0.1.0"
description = "Distributed dense linear algebra over a JAX device mesh: eigh, cholesky, LU solve, factor/solve — one door over ScaLAPACK, SLATE, cuSOLVERMp and the in-tree JAX paths"
requires-python = ">=3.12"

# THE QUARANTINE, DECLARED.  ScaLAPACK / SLATE / cuSOLVERMp appear nowhere
# in this list because nothing here links them: they are reached through
# `jax.ffi` handlers inside a LORRAX `.so` that `distrib_la.loader`
# dlopens by path.  That is the charter's "only distrib_la sees
# scalapack/slate/cusolvermp" made structural — an installed distrib_la on
# a machine with no `.so` imports fine, answers `list_backends`, and
# refuses every FFI backend by name.
#
# lxkit is the shared foundation (Gate/probe vocabulary/jax-version shims).
# jax is the substrate this whole package is written in; unlike lxkit,
# `import distrib_la` DOES import jax, and that is correct: every public
# entry point takes a `jax.sharding.Mesh`.
dependencies = ["lxkit", "jax"]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "numpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
