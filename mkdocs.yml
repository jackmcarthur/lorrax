site_name: LORRAX
site_description: Low-scaling Real-space Real-Axis eXcited state package
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Developer notes / plans / progress / frozen archive are intentionally NOT in
# the site nav and are excluded from the build.
exclude_docs: |
  dev/

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Inputs from DFT: preprocessing.md
  - Installation:
      - Overview: installation/index.md
      - FFI native libraries: installation/ffi-native-libs.md
      - Perlmutter (NERSC): installation/perlmutter.md
  - Environment:
      - Overview: environment/overview.md
      - Collective transports: environment/transports.md
      - Frontera (TACC): environment/machines/frontera.md
      - Perlmutter (NERSC): environment/machines/perlmutter.md
  - User guide:
      - Drivers: drivers.md
      - Input reference: input_reference.md
  - Theory:
      - Overview: theory/overview.md
      - Physics: theory/physics.md
      - ISDF / zeta-V(q): theory/isdf-zeta-vq.md
      - Minimax quadrature: theory/minimax-quadrature.md
      - Symmetry: theory/symmetry.md
      - HL-GPP derivation: theory/hl-gpp-derivation.md
  - Architecture:
      - Design decisions: architecture/decisions.md
      - Layers: architecture/layers.md
      - Codebase: architecture/codebase.md
      - Substrate services: architecture/services.md
      - The FFI layer: architecture/ffi_layout.md
      - SlabIO (sharded-slab HDF5): architecture/slab_io.md
      - Memory model: architecture/memory-model.md
  - Services:
      - Overview — why services exist: services_overview.md
      - Distributed linear algebra: distributed_linalg.md
      - Wavefunction and zeta I/O: wavefunction_io.md
      - Symmetry: symmetry.md
      - The Coulomb interaction: coulomb.md
      - 'API reference: distrib_la': services/distrib_la.md
      - 'API reference: wfn_loader': services/wfn_loader.md
      - 'API reference: zeta_loader': services/zeta_loader.md
      - 'API reference: symmetry_maps': services/symmetry_maps.md
      - 'API reference: vcoul': services/vcoul.md
  - Contributing: contributing.md
