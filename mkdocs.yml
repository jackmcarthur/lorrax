site_name: LORRAX
site_description: Low-scaling Real-space Real-Axis eXcited state package
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Developer notes / plans / progress / frozen archive are intentionally NOT in
# the site nav and are excluded from the build.
exclude_docs: |
  dev/

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Installation:
      - Overview: installation/index.md
      - FFI native libraries: installation/ffi-native-libs.md
      - Perlmutter (NERSC): installation/perlmutter.md
      - Environment reference: ENVIRONMENT_COMPREHENSIVE.md
  - User guide:
      - Overview: user-guide/index.md
  - Theory:
      - Overview: theory/overview.md
      - Physics: theory/physics.md
      - ISDF / zeta-V(q): theory/isdf-zeta-vq.md
      - Minimax quadrature: theory/minimax-quadrature.md
      - Symmetry: theory/symmetry.md
      - HL-GPP derivation: theory/hl-gpp-derivation.md
  - Architecture:
      - Codebase: architecture/codebase.md
      - Memory model: architecture/memory-model.md
      - Multi-host: architecture/multihost.md
  - API reference: api/index.md
  - Contributing: contributing.md
  - Changelog: changelog.md
