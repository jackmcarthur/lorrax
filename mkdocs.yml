site_name: LORRAX
site_description: Low-scaling Real-space Real-Axis eXcited state package
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Developer notes / plans / progress / frozen archive are intentionally NOT in
# the site nav and are excluded from the build.
exclude_docs: |
  dev/

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false

markdown_extensions:
  # attr_list is what turns `## Heading {#custom-id}` into an actual anchor.
  # Without it every explicit anchor in the tree silently became literal text
  # and `mkdocs build --strict` aborted on 25 "does not contain an anchor"
  # warnings -- including the register table's own `index.md#register`, which
  # most pages link to. Measured 2026-08-10: adding this line takes the strict
  # build from 25 warnings to clean.
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Use:
