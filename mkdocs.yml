site_name: LORRAX
site_description: Low-scaling Real-space Real-Axis eXcited state package
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Developer notes / plans / progress / frozen archive are intentionally NOT in
# the site nav and are excluded from the build.
exclude_docs: |
  dev/

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false

markdown_extensions:
  # attr_list is what turns `## Heading {#custom-id}` into an actual anchor.
  # Without it every explicit anchor in the tree silently became literal text
  # and `mkdocs build --strict` aborted on 25 "does not contain an anchor"
  # warnings -- including the register table's own `index.md#register`, which
  # most pages link to. Measured 2026-08-10: adding this line takes the strict
  # build from 25 warnings to clean.
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Inputs from DFT: preprocessing.md
  - Installation:
      - Overview: installation/index.md
      - FFI native libraries: installation/ffi-native-libs.md
      - Building the FFI libraries: building_ffi.md
      - Perlmutter (NERSC): installation/perlmutter.md
  - Environment:
      - Overview: environment/overview.md
      - Collective transports: environment/transports.md
      - Per-leg bring-up floor and the warm worker: warm_worker.md
      - Frontera (TACC): environment/machines/frontera.md
      - Perlmutter (NERSC): environment/machines/perlmutter.md
  - User guide:
      - Drivers: drivers.md
      - Input reference: input_reference.md
      - Downfold driver: downfold.md
  - Theory:
      - Overview: theory/overview.md
      - Physics: theory/physics.md
      - Direct Hartree field: theory/hartree.md
      - ISDF / zeta-V(q): theory/isdf-zeta-vq.md
      - Minimax quadrature: theory/minimax-quadrature.md
      - Symmetry: theory/symmetry.md
      - S-tensor convention: theory/s-tensor-convention.md
      - LT splitting and the exchange head: theory/lt-exchange-head.md
      - Four-current heads and frequency: theory/four-current-head-corrections.md
      - HL-GPP derivation: theory/hl-gpp-derivation.md
      - MPA compute mode (declared, not yet runnable): theory/THEORY_mpa_implementation.md
      - Metallic MPA screening: theory/metallic-mpa-screening.md
  - Architecture:
      - Design decisions: architecture/decisions.md
      - Layers: architecture/layers.md
      - Codebase: architecture/codebase.md
      - Substrate services: architecture/services.md
      - The FFI layer: architecture/ffi_layout.md
      - SlabIO (sharded-slab HDF5): architecture/slab_io.md
      - Memory model: architecture/memory-model.md
  - Services:
      - distrib_la (distributed dense linalg): services/distrib_la.md
      - symmetry_maps (k-grid reduction, stars, unfolds): services/symmetry_maps.md
  - Contributing: contributing.md
