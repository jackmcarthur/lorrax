# Build the LORRAX manual (manual/) and deploy it to GitHub Pages.
name: manual

on:
  push:
    branches: [main]
    paths: ["manual/**", ".github/workflows/manual.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: manual/requirements.txt
      - run: pip install -r manual/requirements.txt
      - name: Check manual figure assets
        run: |
          python - <<'PY'
          from pathlib import Path
          image_types = {'.png', '.jpg', '.jpeg', '.webp', '.gif', '.svg', '.pdf'}
          assets = Path('manual/docs/assets')
          required = [assets / ('figures/tutorial-mos2-exciton-bands.' + ext)
                      for ext in ('png', 'pdf')]
          images = set(required) | {p for p in assets.rglob('*') if p.suffix.lower() in image_types}
          invalid = [str(p) for p in images if not p.is_file() or not p.stat().st_size]
          if invalid:
              raise SystemExit('Missing or empty manual figures: ' + ', '.join(invalid))
          tutorial = Path('manual/docs/tutorials/mos2-soc.md').read_text()
          if any(p.name not in tutorial for p in required):
              raise SystemExit('The MoS2 tutorial must retain its executed exciton figure links')
          PY
      - run: mkdocs build --strict -f manual/mkdocs.yml -d "$GITHUB_WORKSPACE/_site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
